name: 功能建议
description: 提议一个明确且可验证的改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先说明当前工作流中的实际困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 什么结果可以证明这个功能已经完成？
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: 是否可能触发付费 API 或上传私人素材
      options:
        - 否
        - 是
        - 不确定
    validations:
      required: true
